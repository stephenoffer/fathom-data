[project]
name = "fathom-data"
dynamic = ["version"]
description = "Lineage, partition-scoped invalidation, profiling, and policy propagation for data platforms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Stephen Offer" }]
keywords = ["lineage", "data-quality", "iceberg", "delta-lake", "partitions", "backfill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "pyarrow>=15",
    "sqlglot>=25",
    "click>=8.1",
    "pyyaml>=6",
    "fsspec>=2024.2",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
# Iceberg manifests are Avro, so unlike Delta this cannot be read without a library.
iceberg = ["pyiceberg>=0.9", "pyiceberg-core>=0.5"]
s3 = ["s3fs>=2024.2"]
gcs = ["gcsfs>=2024.2"]
azure = ["adlfs>=2024.2"]
cloud = ["s3fs>=2024.2", "gcsfs>=2024.2", "adlfs>=2024.2"]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "duckdb>=1.0",
    "pyiceberg>=0.9",
    "pyiceberg-core>=0.5",
    # Only needed to create real Iceberg tables in the test suite.
    "sqlalchemy>=2",
    "s3fs>=2024.2",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/stephenoffer/fathom-data"
Source = "https://github.com/stephenoffer/fathom-data"

[project.scripts]
fathom = "fathom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fathom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
# The test tree mirrors the package tree, so `graph/test_diff.py` and
# `govern/test_diff.py` both exist. Under the default import mode pytest names
# modules by basename and the second one collides with the first; importlib mode
# resolves them by path, which is what makes the mirror survive growth.
pythonpath = ["tests", "tests/adapters/conformance"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["fathom"]
strict = true
warn_return_any = true

# sqlglot's AST is dynamically shaped and pyarrow ships no stubs; both are handled
# defensively at the call sites instead.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "sqlglot.*", "duckdb.*", "pyiceberg.*", "fsspec.*"]
ignore_missing_imports = true
