name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - name: lint
        run: uv run ruff check src tests
      - name: format
        run: uv run ruff format --check src tests
      - name: types
        run: uv run mypy
      - name: tests
        # Property tests carry the soundness invariant, so give them room to explore.
        run: uv run pytest -q --hypothesis-seed=0
