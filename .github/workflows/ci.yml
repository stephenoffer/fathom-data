name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here may reach a network. The suite uses local disk and memory:// for
# every storage path, so a test that starts needing credentials is a test that has
# started depending on someone's account.
env:
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_DEFAULT_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"

      - name: lint
        run: uv run ruff check src tests examples
      - name: format
        run: uv run ruff format --check src tests examples
      - name: types
        run: uv run mypy

      - name: tests
        # Property tests carry the soundness invariant, so give them room to explore.
        run: uv run pytest -q --hypothesis-seed=0

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"

      # Documentation that is not executed rots. The examples run as scripts, and
      # test_docs checks that every documented command and adapter exists.
      - name: examples
        run: uv run pytest tests/test_examples.py -q
      - name: docs integrity
        run: uv run pytest tests/test_docs.py -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: build the wheel
        run: uv build
      - name: install from the wheel and smoke-test the CLI
        run: |
          uv venv fresh
          uv pip install --python fresh/bin/python dist/*.whl
          fresh/bin/fathom --version
          fresh/bin/fathom adapters
